<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ramadan Learning App UI</title>
  <style>
    :root {
      --gold-1: #ffd78a;
      --gold-2: #ffb347;
      --gold-3: #d47a1b;
      --deep-blue: #10163d;
      --purple-1: #2f1f57;
      --purple-2: #4a2f71;
      --card-bg: linear-gradient(145deg, #ffd79a, #f3ac55);
      --button-bg: linear-gradient(145deg, #ae4a11, #7a2f07);
      --teal-btn: linear-gradient(145deg, #2f8093, #14616e);
      --text-dark: #4b230e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1d2558 0%, #0a0d26 70%);
      font-family: "Segoe UI", "Poppins", Arial, sans-serif;
      color: #ffeecf;
      padding: 20px;
    }

    .phone {
      width: 1080px;
      height: 1920px;
      border-radius: 56px;
      overflow: hidden;
      position: relative;
      background:
        radial-gradient(circle at 50% 16%, #aa5827 0%, #46244d 34%, #171b46 70%, #0b102f 100%);
      box-shadow: 0 40px 80px rgba(0,0,0,0.55), inset 0 0 120px rgba(255,183,71,0.2);
      padding: 56px 48px 42px;
    }

    .stars,
    .stars::before,
    .stars::after {
      position: absolute;
      inset: 0;
      content: "";
      background-image:
        radial-gradient(circle, rgba(255,223,140,0.95) 1px, transparent 2px),
        radial-gradient(circle, rgba(255,210,125,0.8) 1px, transparent 3px);
      background-size: 130px 130px, 170px 170px;
      background-position: 10px 20px, 50px 80px;
      opacity: 0.45;
      pointer-events: none;
    }
    .stars::before { transform: translateY(20px); opacity: 0.24; }
    .stars::after { transform: translateX(40px); opacity: 0.2; }

    .moon {
      position: absolute;
      top: 88px;
      left: 50%;
      width: 168px;
      height: 168px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff7b5, #ffc847 58%, #e18d20 100%);
      box-shadow: 0 0 45px rgba(255, 209, 98, 0.85);
    }

    .moon::after {
      content: "";
      position: absolute;
      top: 12px;
      left: 52px;
      width: 156px;
      height: 156px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #813154 0%, #2d2551 56%, #1a1f47 100%);
    }

    .lantern {
      position: absolute;
      width: 86px;
      height: 170px;
      background: linear-gradient(180deg, #ffcc72, #d17717);
      border: 4px solid #84400f;
      border-radius: 18px;
      box-shadow: 0 0 28px rgba(255, 181, 78, 0.8);
    }

    .lantern::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -44px;
      transform: translateX(-50%);
      width: 3px;
      height: 42px;
      background: #b9763a;
    }

    .lantern.left { top: 88px; left: 86px; }
    .lantern.right { top: 110px; right: 98px; height: 156px; }

    .title {
      margin-top: 210px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .title h1 {
      margin: 0;
      font-size: 84px;
      font-weight: 700;
      color: #ffd99f;
      text-shadow: 0 2px 0 #6f2f16, 0 0 34px rgba(255, 198, 98, 0.4);
      letter-spacing: 1px;
    }

    .title p {
      margin: 16px 0 0;
      font-size: 44px;
      font-weight: 600;
      color: #ffe0aa;
    }

    .mosque-horizon {
      height: 118px;
      margin: 34px -48px 0;
      background:
        radial-gradient(circle at 80% 100%, #2a1833 0 100px, transparent 101px),
        radial-gradient(circle at 72% 100%, #2a1833 0 74px, transparent 75px),
        radial-gradient(circle at 88% 100%, #2a1833 0 54px, transparent 55px),
        linear-gradient(180deg, rgba(255,190,100,0.4), transparent 68%),
        linear-gradient(0deg, #261534, #3b1f3c 70%);
    }

    .cards {
      position: relative;
      z-index: 3;
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 30px;
      min-height: 260px;
      border: 3px solid rgba(255, 236, 187, 0.6);
      box-shadow: 0 14px 30px rgba(10, 5, 20, 0.36), inset 0 0 40px rgba(255, 243, 220, 0.26);
      padding: 20px 20px 18px;
      color: var(--text-dark);
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .icon {
      width: 110px;
      height: 84px;
      margin-bottom: 8px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: rgba(255, 230, 170, 0.45);
      box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.3);
      font-size: 54px;
    }

    .card h2 {
      margin: 2px 0 12px;
      font-size: 52px;
      line-height: 1.04;
    }

    .btn {
      align-self: end;
      justify-self: start;
      padding: 14px 30px;
      border-radius: 999px;
      color: #ffe8cf;
      font-size: 38px;
      font-weight: 700;
      background: var(--button-bg);
      box-shadow: 0 8px 18px rgba(104, 41, 8, 0.4);
    }
    .btn.teal { background: var(--teal-btn); }

    .daily {
      margin-top: 26px;
      border-radius: 30px;
      padding: 16px 20px 20px;
      border: 3px solid rgba(255, 223, 153, 0.45);
      background: linear-gradient(180deg, rgba(118,49,61,0.48), rgba(57,25,57,0.3));
      box-shadow: inset 0 0 42px rgba(255,178,83,0.2);
    }

    .daily h3 {
      margin: 0 0 14px;
      text-align: center;
      font-size: 62px;
      color: #ffe1ad;
      letter-spacing: 1px;
    }

    .tip-card {
      border-radius: 28px;
      background: linear-gradient(140deg, #ffd9a5, #efaf67);
      padding: 22px;
      display: grid;
      grid-template-columns: 0.8fr 1.2fr;
      gap: 18px;
      color: #4a230f;
      border: 3px solid rgba(255, 245, 217, 0.6);
    }

    .tip-image {
      border-radius: 20px;
      background: radial-gradient(circle at 30% 20%, #ffe4be, #f0a24d);
      padding: 14px;
      display: grid;
      place-items: center;
      font-size: 86px;
      box-shadow: inset 0 0 28px rgba(255,255,255,0.3);
    }

    .tip-content p {
      margin: 10px 0 20px;
      font-size: 42px;
      line-height: 1.14;
      font-weight: 700;
    }

    .carousel-dots {
      margin-top: 18px;
      text-align: center;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
      margin: 0 8px;
      background: rgba(255, 209, 129, 0.55);
    }
    .dot.active { background: #ffd17e; }

    .nav {
      margin-top: 20px;
      height: 128px;
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(78,49,80,0.95), rgba(43,30,67,0.95));
      border: 2px solid rgba(255, 223, 165, 0.2);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
      padding: 0 18px;
    }

    .nav-item {
      text-align: center;
      color: #ffdca3;
      font-size: 34px;
      font-weight: 600;
    }

    .nav-item .emoji {
      display: block;
      font-size: 46px;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <main class="phone">
    <div class="stars"></div>
    <div class="moon"></div>
    <div class="lantern left"></div>
    <div class="lantern right"></div>

    <header class="title">
      <h1>Happy Ramadan!</h1>
      <p>Learn &amp; Explore with us</p>
    </header>

    <section class="mosque-horizon"></section>

    <section class="cards">
      <article class="card">
        <div class="icon">📖</div>
        <h2>Quran<br/>Lessons</h2>
        <div class="btn">Start Learning</div>
      </article>
      <article class="card">
        <div class="icon">📜</div>
        <h2>Hadiths<br/>&amp; Duas</h2>
        <div class="btn">Discover More</div>
      </article>
      <article class="card">
        <div class="icon">❓</div>
        <h2>Ramadan<br/>Quiz</h2>
        <div class="btn teal">Take Quiz</div>
      </article>
      <article class="card">
        <div class="icon">🕌</div>
        <h2>Prayer<br/>Times</h2>
        <div class="btn">View Schedule</div>
      </article>
    </section>

    <section class="daily">
      <h3>Daily Tip</h3>
      <div class="tip-card">
        <div class="tip-image">🥣💧</div>
        <div class="tip-content">
          <p>Remember to hydrate and break your fast with dates.</p>
          <div class="btn">Read More</div>
        </div>
      </div>
      <div class="carousel-dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </section>

    <nav class="nav">
      <div class="nav-item"><span class="emoji">🏠</span>Home</div>
      <div class="nav-item"><span class="emoji">📚</span>Courses</div>
      <div class="nav-item"><span class="emoji">🔖</span>Bookmarks</div>
      <div class="nav-item"><span class="emoji">👤</span>Profile</div>
    </nav>
  </main>
</body>
</html>
